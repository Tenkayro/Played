			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def githubReleaseHeaderFile = rootProject.file(".public/release-header.md")
def changelogFile = rootProject.file(".public/changelog.md")
def generatedGithubReleaseNotes = layout.buildDirectory.file("github-release-notes.md")

def prepareGithubReleaseNotes = tasks.register("prepareGithubReleaseNotes") {
	group = "upload"
	description = "Combine the release header and changelog for GitHub"
	inputs.files(githubReleaseHeaderFile, changelogFile)
	outputs.file(generatedGithubReleaseNotes)
	mustRunAfter(tasks.named("build"))

	doLast {
		if (!githubReleaseHeaderFile.isFile()) {
			throw new GradleException("GitHub release header not found: ${githubReleaseHeaderFile}")
		}
		if (!changelogFile.isFile()) {
			throw new GradleException("Changelog not found: ${changelogFile}")
		}

		File outputFile = generatedGithubReleaseNotes.get().asFile
		outputFile.parentFile.mkdirs()
		outputFile.setText(
			githubReleaseHeaderFile.getText("UTF-8").trim() +
			"\n\n" +
			changelogFile.getText("UTF-8").trim() +
			"\n",
			"UTF-8"
		)
		println ">>> GitHub: Prepared release notes at ${outputFile}"
	}
}

def githubRelease = tasks.register("githubRelease", Exec) {
	group = "upload"
	description = "Create a GitHub release with platform download links and the changelog"
	dependsOn(prepareGithubReleaseNotes)
	mustRunAfter(tasks.named("modrinth"))
	mustRunAfter(tasks.named("curseforge"))

	doFirst {
		if (githubRepository == null || githubRepository.isBlank()) {
			throw new GradleException("Set github_repository in gradle.properties before publishing to GitHub.")
		}

		File releaseNotesFile = generatedGithubReleaseNotes.get().asFile
		if (!releaseNotesFile.isFile()) {
			throw new GradleException("GitHub release notes file not found: ${releaseNotesFile}")
		}

		if (githubToken != null && !githubToken.isBlank()) {
			environment "GH_TOKEN", githubToken
		}

		String releaseTag = "v${resolvedModVersion}"
		commandLine(
			"gh",
			"release",
			"create",
			releaseTag,
			"--repo",
			githubRepository,
			"--target",
			"main",
			"--title",
			"Played ${resolvedModVersion} for Fabric ${project.minecraft_version}",
			"--notes-file",
			releaseNotesFile.absolutePath
		)
		println ">>> GitHub: Creating release ${releaseTag} in ${githubRepository}..."
	}

	doLast {
		println ">>> GitHub: Successfully created release v${resolvedModVersion}!"
	}
}

if (isReleaseRequest) {
	tasks.named("curseforge") {
		dependsOn(verifyModrinthRelease)
		mustRunAfter(verifyModrinthRelease)
	}
	githubRelease.configure {
		dependsOn(tasks.named("curseforge"))
	}
}

def persistReleasedVersion = tasks.register("persistReleasedVersion") {
	group = null
	description = "Store the new version only after all release platforms succeeded"
	dependsOn(githubRelease)

	doLast {
		if (pendingReleaseVersion == null) {
			throw new GradleException("No pending release version. Run publishPatch or publishMinor.")
		}

		File propertiesFile = rootProject.file("gradle.properties")
		String propertiesText = propertiesFile.getText("UTF-8")
		def matcher = (propertiesText =~ /(?m)^(mod_version=)([^\r\n]+)$/)
		if (!matcher.find()) {
			throw new GradleException("mod_version is missing from ${propertiesFile}.")
		}

		String currentStoredVersion = matcher.group(2)
		if (currentStoredVersion != storedModVersion && currentStoredVersion != pendingReleaseVersion) {
			throw new GradleException("mod_version changed during publishing (${currentStoredVersion}); refusing to overwrite it.")
		}

		if (currentStoredVersion != pendingReleaseVersion) {
			propertiesText = matcher.replaceFirst(java.util.regex.Matcher.quoteReplacement("mod_version=${pendingReleaseVersion}"))
			propertiesFile.setText(propertiesText, "UTF-8")
		}
		println ">>> Stored successful release version ${pendingReleaseVersion} in gradle.properties."
	}
}

tasks.register("publishPatch") {
	group = "upload"
	description = "Reliably upload to Modrinth, CurseForge, and GitHub, then store the bumped patch version"
	dependsOn(persistReleasedVersion)
	doLast {
		println ""
		println "============================================================="
		println " \u2728 SUCCESSFULLY PUBLISHED PATCH UPDATE TO ALL PLATFORMS \u2728"
		println "============================================================="
		println ""
	}
}

tasks.register("publishMinor") {
	group = "upload"
	description = "Reliably upload to Modrinth, CurseForge, and GitHub, then store the bumped minor version"
	dependsOn(persistReleasedVersion)
	doLast {
		println ""
		println "============================================================="
		println " \u2728 SUCCESSFULLY PUBLISHED MINOR UPDATE TO ALL PLATFORMS \u2728"
		println "============================================================="
		println ""
	}
}
